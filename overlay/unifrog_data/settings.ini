# CajuOS GB300 — defaults de operação
# Este arquivo é editável no cartão e não contém ROMs nem BIOS.
language_name=portugues
theme_name=caju
storage_profile=boot
rom_root=/ROMS
rom_root_label=Biblioteca
# Diagnóstico conservador: não varre a raiz inteira do cartão.
rom_roots=/ROMS
rom_system=snes:snes9x2002
rom_system=supernintendo:snes9x2002
rom_system=psx:qpsx
rom_system=ps1:qpsx
home_layout=systems_vertical
frameskip=1
audio=1
cpu=918
# Perfil padrão do menu pré-jogo: 0 compatibilidade, 1 balanceado, 2 desempenho, 3 ultra.
performance_profile=1
skip_duplicate_frames=0
# Chave canônica do frontend nativo; 0 corresponde ao perfil GE rápido 198 MHz.
ge_clock=0
# Mantido para compatibilidade com variantes que ainda leem a chave legada.
ge=0
# Chave canônica do frontend nativo.
backlight=50
# Mantido para compatibilidade com variantes que ainda leem a chave legada.
brightness=50
launch_splash=1
boxart_hidden=0
sound_enabled=1
log_flush_every=0
# Atalhos documentados; o frontend nativo deve manter SELECT como modificador.
hotkey_resume=a
hotkey_screenshot=x
hotkey_flush_log=y
